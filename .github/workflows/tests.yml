name: Tests

on: ['push', 'pull_request']

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.4', '8.5']
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:

    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: fileinfo, gmp, intl, sqlite3, pdo_sqlite, pdo_mysql
        tools: composer:v2
        coverage: pcov

    - name: Setup Problem Matches
      run: |
        echo "::add-matcher::${{ runner.tool_cache }}/php.json"
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Generate access token
      uses: actions/create-github-app-token@v3
      id: generate_token
      with:
        client-id: ${{ secrets.COW_APP_ID }}
        private-key: ${{ secrets.COW_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}

    - name: Setup Composer auth for GitHub
      env:
        GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
      run: |
        composer config --global http-basic.github.com x-access-token $GITHUB_TOKEN

    - name: Install Composer dependencies
      run: composer update --${{ matrix.dependency-version }} --no-interaction --prefer-dist --no-suggest

    - name: Create tests database
      run: php -r "touch('database'.DIRECTORY_SEPARATOR.'database.sqlite');"

    - name: PHPUnit Testing
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: vendor/bin/pest --coverage

    - name: Build
      env:
        APP_ENV: development
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php exchange-notify app:build --build-version=0.0

    - name: Build Check
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php builds/exchange-notify help --version
